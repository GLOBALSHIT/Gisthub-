<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>GistHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234a90e2'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root{--blue:#4a90e2;--blue-soft:#eaf3fd;--ink:#14202b;--mute:#6b7a89;--line:#e7ecf1;--panel:#f5f8fb;--red:#e5484d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.6;cursor:default}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:19px;margin:0}
h3{font-size:16px;margin:8px 0 2px}
p{margin:0}
svg{display:block;flex:none}
.mu{color:var(--mute);font-size:13px}
.un{font-weight:700}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strong{color:var(--ink);font-weight:600}
#app{max-width:980px;margin:0 auto}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px}
.logo{font-size:21px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
.tr{display:flex;align-items:center;gap:2px}
.ib{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:50%}
.ib .bd{top:3px;right:2px;left:auto}
.adbtn{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:6px 11px;margin-right:4px}
main{padding:12px 12px 80px;min-height:100vh}
.bottom{position:fixed;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--mute);gap:2px;position:relative}
.bottom a.on{color:var(--blue)}
.bottom .pl{font-size:0}
.bottom .pl span.c{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bd.in{position:static;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.sec{background:var(--blue-soft);color:var(--blue)}
.btn.gray{background:var(--panel);color:var(--ink)}
.btn.full{width:100%}
.ghost{color:var(--mute);display:inline-flex;align-items:center;padding:4px;cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.sm{width:32px;height:32px;font-size:13px}
.av.lg{width:84px;height:84px;font-size:30px}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;font-size:16px}
.in:focus{border-color:var(--blue)}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:999px;background:var(--panel);color:var(--ink);font-weight:800;white-space:nowrap;font-size:14px}
.tab.on{background:var(--blue);color:#fff}
.comp{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.comp.g{flex-direction:column;align-items:flex-start;gap:8px}
.cb{flex:1;min-width:0}
.cb textarea{width:100%;border:0;outline:none;resize:none;min-height:48px;font-size:16px;background:none}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.pv{position:relative;display:inline-block;margin-top:6px}
.pv img{max-height:160px;max-width:100%;border-radius:12px;display:block}
.pv button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(20,32,43,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px}
.pm{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pt{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}
.pimg{display:block;width:100%;height:auto;border-radius:14px;margin-top:8px;background:var(--panel);object-fit:cover}
.pa{display:flex;gap:22px;margin-top:10px;color:var(--mute)}
.pa button,.pa a{display:flex;align-items:center;gap:6px;font-size:14px}
.pa .liked{color:var(--red)}
.pa .liked svg{fill:var(--red)}
.ad{background:var(--panel);border-radius:16px;padding:12px;margin:10px 0;border:0}
.tag{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:999px}
.ad p{margin:2px 0 10px;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .acts{display:flex;gap:6px;flex:none;align-items:center}
.nt.unread{background:var(--blue-soft);margin:0 -12px;padding-left:12px;padding-right:12px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--mute)}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.sec-h{font-size:13px;font-weight:800;color:var(--mute);margin:18px 0 2px}
.prof{padding:4px 0 8px}
.prof .top2{display:flex;align-items:center;gap:14px}
.stats{display:flex;gap:18px;margin:12px 0;font-size:14px}
.stats b{font-size:16px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--panel);display:block}
.chat{display:flex;flex-direction:column;height:100dvh}
.chh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.bub{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--panel);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{background:var(--blue);color:#fff;align-self:flex-end}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:2px;text-align:right}
.cin{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.cin .in{border-radius:999px}
.cin .btn.ic{padding:0;width:42px;height:42px;flex:none}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt p{overflow-wrap:anywhere;white-space:pre-wrap}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.auth{max-width:380px;margin:20px auto}
.auth .logo{font-size:30px;display:block;text-align:center;margin-bottom:4px}
.auth p.c{text-align:center;color:var(--mute);margin-bottom:12px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.ok{color:#1a8a4a;font-size:14px;margin-top:8px}
.spin{width:22px;height:22px;border:3px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;margin:18px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--mute)}
.pill.on{background:#e6f6ec;color:#1a8a4a}
body.chatting .bottom,body.chatting .top{display:none}
body.chatting main{padding:0}
@media(min-width:768px){
 #app{display:grid;grid-template-columns:230px 1fr;gap:24px}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 0;gap:2px}
 .side .logo{padding:0 14px 14px;font-size:26px}
 .sl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;font-weight:700;font-size:16px;color:var(--ink);text-align:left;width:100%}
 .sl:hover{background:var(--panel)}
 .sl.on{background:var(--blue-soft);color:var(--blue)}
 .sl .bd{position:static;margin-left:auto}
 .side .sp{flex:1}
 .top,.bottom{display:none}
 main{max-width:620px;width:100%;padding:16px 18px 40px;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
 .chat{height:calc(100vh - 32px)}
 body.chatting main{padding:16px 18px}
 .nt.unread{margin:0 -18px;padding-left:18px;padding-right:18px}
 #toast{bottom:30px}
}
</style>
</head>
<body>
<div id="app">
 <aside class="side" id="side"></aside>
 <div><header class="top" id="top"></header><main id="view"><div class="spin" aria-label="Loading"></div></main></div>
</div>
<nav class="bottom" id="bottom" aria-label="Main"></nav>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
"use strict";
const SB_URL='https://txfwngecuzwbkhflxnzi.supabase.co';
const SB_KEY='sb_publishable_nIzEmvlA9eqlbcd5zsL6tg_78Oyd0aH'; /* publishable key: safe in frontend, data is protected by RLS */
const PAGE=12,PCOLS='id,username,bio,avatar_url,role,created_at';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!window.supabase){$('#view').innerHTML='<div class="empty"><b>Could not load GistHub</b>Check your internet connection and refresh the page.</div>';return}
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

const IC={
home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
share:'<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>',
image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
mega:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>'
};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- state ---------- */
const S={me:null,fr:[],cnt:{n:0,c:0,f:0},wa:'2348000000000',tab:'latest',ptab:'posts',mode:'login',img:null,av:null,adimg:null,adm:'users',q:'',busy:false,ch:null};
const PC={},POSTS={},seenMsg=new Set();
let io=null,feed=null,lastKey='',rtok=0,sTok=0,sTimer=0,chatInfo=null;

/* ---------- helpers ---------- */
const ago=t=>{const s=(Date.now()-new Date(t))/1e3;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return new Date(t).toLocaleDateString([],{day:'numeric',month:'short'})};
const clock=t=>{const d=new Date(t),tm=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toDateString()===new Date().toDateString()?tm:d.toLocaleDateString([],{day:'numeric',month:'short'})+', '+tm};
const route=()=>{const p=(location.hash||'#/home').slice(2).split('/');return{a:p[0]||'home',b:decodeURIComponent(p.slice(1).join('/'))}};
const navTo=h=>{if(location.hash===h)render();else location.hash=h};
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
const needLogin=()=>{toast('Log in to continue');location.hash='#/auth'};
const bd=(n,c='')=>n?`<span class="bd ${c}">${n>99?'99+':n}</span>`:'';
const empty=(t,s='',btn='')=>`<div class="empty"><b>${t}</b>${s}${btn}</div>`;
function errMsg(e){const m=(e&&e.message)||String(e);
 if(/row-level security|permission denied/i.test(m))return'You do not have permission to do that.';
 if(/schema cache|does not exist|PGRST20/i.test(m))return'Database is not set up yet. Run schema.sql in the Supabase SQL Editor.';
 if(/failed to fetch|networkerror|load failed/i.test(m))return'No connection ('+m+'). If this keeps happening, the Supabase project may be paused.';
 return m}
function avatar(u,c=''){u=u||{};const l=esc((u.username||'?')[0].toUpperCase());return u.avatar_url?`<img class="av ${c}" src="${esc(u.avatar_url)}" alt="" loading="lazy" decoding="async">`:`<span class="av ${c}">${l}</span>`}
function shrink(file,max,q,sq){return new Promise((res,rej)=>{
 if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej('Choose a JPG, PNG or WebP image.');
 if(file.size>12e6)return rej('Image is too large. Maximum is 12 MB.');
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;
  if(sq){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;w=h=Math.min(max,s)}
  else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(url);
  c.toBlob(b=>b?res({blob:b,w,h,url:URL.createObjectURL(b)}):rej('Could not process that image.'),'image/jpeg',q)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej('Could not read that image.')};img.src=url})}
async function upload(bucket,path,blob,upsert){const{error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:!!upsert});if(error)throw error;return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl}
const storagePath=(url,bucket)=>{const i=String(url||'').indexOf('/object/public/'+bucket+'/');return i<0?null:url.slice(i+('/object/public/'+bucket+'/').length).split('?')[0]};
const waLink=t=>'https://wa.me/'+String(S.wa).replace(/\D/g,'')+'?text='+encodeURIComponent(t);
async function loadProfiles(ids){const miss=[...new Set(ids)].filter(i=>i&&!PC[i]);if(!miss.length)return;const{data}=await sb.from('profiles').select(PCOLS).in('id',miss);(data||[]).forEach(p=>PC[p.id]=p)}
async function getProfileByName(n){const{data}=await sb.from('profiles').select(PCOLS).eq('username',n).maybeSingle();if(data)PC[data.id]=data;return data}

/* ---------- friendships ---------- */
const frOf=id=>S.fr.find(f=>f.requester===id||f.addressee===id);
const friendIds=()=>S.me?S.fr.filter(f=>f.status==='accepted').map(f=>f.requester===S.me.id?f.addressee:f.requester):[];
async function refreshFr(){if(!S.me)return;const{data}=await sb.from('friendships').select('*').or('requester.eq.'+S.me.id+',addressee.eq.'+S.me.id);S.fr=data||[];S.cnt.f=S.fr.filter(f=>f.status==='pending'&&f.addressee===S.me.id).length}
function relation(u){if(!S.me)return'guest';if(S.me.id===u.id)return'self';const f=frOf(u.id);if(!f)return'none';if(f.status==='accepted')return'friends';return f.requester===S.me.id?'sent':'received'}
function friendBtn(u,big){
 const r=relation(u),s=big?'':' sm',i=`data-id="${u.id}"`;
 if(r==='self')return'';
 if(r==='guest'||r==='none')return `<button class="btn${s}" data-act="addfriend" ${i}>Add friend</button>`;
 if(r==='sent')return `<button class="btn gray${s}" data-act="cancelreq" ${i}>Cancel request</button>`;
 if(r==='received')return `<button class="btn${s}" data-act="accept" ${i}>Accept</button><button class="btn gray${s}" data-act="reject" ${i}>Reject</button>`;
 return `<a class="btn sec${s}" href="#/chat/${u.id}">Message</a><button class="btn gray${s}" data-act="unfriend" ${i}>Remove</button>`}
const userRow=(u,extra)=>u?`<div class="row"><a href="#/u/${esc(u.username)}">${avatar(u)}</a><div class="grow"><a class="un ellip" href="#/u/${esc(u.username)}" style="display:block">${esc(u.username)}</a><div class="mu ellip">${esc(u.bio||'')}</div></div><div class="acts">${extra??friendBtn(u)}</div></div>`:'';
const notFound=()=>empty('Not found','This page does not exist or was removed.','<a class="btn" href="#/home">Go home</a>');

/* ---------- posts ---------- */
const norm=(p,liked)=>({id:p.id,user_id:p.user_id,body:p.body,image_url:p.image_url,thumb_url:p.thumb_url,image_w:p.image_w,image_h:p.image_h,created_at:p.created_at,likes:+p.like_count||0,comments:+p.comment_count||0,liked:!!liked});
function postHTML(p,full){
 const u=PC[p.user_id]||{username:'deleted'},canDel=S.me&&(S.me.id===p.user_id||S.me.role==='admin');
 return `<article class="post" data-post="${p.id}"${full?' data-full="1"':''}>
 <div class="ph"><a href="#/u/${esc(u.username)}" aria-label="${esc(u.username)}">${avatar(u)}</a><div class="pm"><a class="un ellip" href="#/u/${esc(u.username)}">${esc(u.username)}</a><span class="mu">${ago(p.created_at)}</span></div>${canDel?`<button class="ghost" data-act="delpost" data-id="${p.id}" aria-label="Delete post">${ic('trash',18)}</button>`:''}</div>
 ${p.body?`<p class="pt"${full?'':` data-go="#/p/${p.id}"`}>${esc(p.body)}</p>`:''}
 ${p.image_url?`<img class="pimg" src="${esc(p.image_url)}" loading="lazy" decoding="async" alt="" ${p.image_w?`width="${p.image_w}" height="${p.image_h}" style="aspect-ratio:${p.image_w}/${p.image_h}"`:''}>`:''}

async function fetchPosts(q,from){
 let r=sb.from('posts_feed').select('*');
 if(q.user)r=r.eq('user_id',q.user);
 if(q.ids)r=r.in('user_id',q.ids);
 if(q.photos)r=r.not('image_url','is',null);
 if(q.trending)r=r.gte('created_at',new Date(Date.now()-30*864e5).toISOString()).order('score',{ascending:false});
 r=r.order('created_at',{ascending:false}).range(from,from+PAGE-1);
 const{data,error}=await r;if(error)throw error;
 const rows=data||[];let liked=new Set();
 const[,ls]=await Promise.all([loadProfiles(rows.map(p=>p.user_id)),S.me&&rows.length?sb.from('likes').select('post_id').eq('user_id',S.me.id).in('post_id',rows.map(p=>p.id)):null]);
 if(ls&&ls.data)liked=new Set(ls.data.map(l=>l.post_id));
 return rows.map(p=>(POSTS[p.id]=norm(p,liked.has(p.id))))}
const feedItem=(kind,p)=>kind==='grid'?`<a href="#/p/${p.id}"><img src="${esc(p.thumb_url||p.image_url)}" loading="lazy" decoding="async" alt="" width="200" height="200"></a>`:

async function loadMore(){
 const F=feed;if(!F||F.loading||F.done)return;F.loading=true;const s=$('#sentinel');
 if(s)s.innerHTML='<div class="spin" aria-label="Loading"></div>';
 try{
  const rows=await fetchPosts(F.q,F.from);if(F!==feed)return;
  F.from+=PAGE;const el=$('#feed');let h='';
  rows.forEach(p=>{h+=feedItem(F.kind,p);F.idx++;if(F.kind==='post'&&F.ads.length&&F.idx%5===0)h+=adHTML(F.ads[(F.idx/5-1)%F.ads.length])});
  if(el)el.insertAdjacentHTML('beforeend',h);
  if(rows.length<PAGE){F.done=true;if(s)s.remove();if(io){io.disconnect();io=null}}
  if(F.from===PAGE&&!rows.length&&el)el.innerHTML=F.emptyHTML;
 }catch(e){if(F===feed&&s)s.innerHTML=`<div class="empty">${esc(errMsg(e))}<br><button class="btn sm gray" data-act="retry" style="margin-top:10px">Try again</button></div>`;F.err=true}
 finally{F.loading=false;if(F===feed&&io&&s&&s.isConnected&&!F.err){io.unobserve(s);io.observe(s)}}}
function startFeed(q,kind,emptyHTML,ads){
 feed={q,kind,from:0,done:false,loading:false,idx:0,ads:ads||[],emptyHTML,err:false};
 const s=$('#sentinel');
 if(s&&'IntersectionObserver'in window){io=new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore()},{rootMargin:'500px'});io.observe(s)}else loadMore()}

 $('#top').innerHTML=`<a class="logo" href="#/home">GistHub</a><div class="tr"><button class="adbtn" data-act="adv">Advertise</button><a class="ib" href="${m?'#/friends':'#/auth'}" aria-label="Friends">${ic('users')}${bd(c.f)}</a><a class="ib" href="${m?'#/notifs':'#/auth'}" aria-label="Notifications">${ic('bell')}${bd(c.n)}</a></div>`;
 const sl=(h,i,t,o,n)=>`<a class="sl ${o?'on':''}" href="${h}">${ic(i)}${t}${bd(n)}</a>`;
 $('#side').innerHTML=`<a class="logo" href="#/home">GistHub</a>${sl('#/home','home','Home',on.home)}${sl('#/search','search','Search',on.search)}${sl(m?'#/post':'#/auth','plus','Post',on.post)}${sl(m?'#/chats':'#/auth','chat','Chats',on.chats,c.c)}${sl(own,'user','Profile',on.prof)}${sl(m?'#/friends':'#/auth','users','Friends',a==='friends',c.f)}${sl(m?'#/notifs':'#/auth','bell','Notifications',a==='notifs',c.n)}<button class="sl" data-act="adv">${ic('mega')}Advertise With Us</button>${m&&m.role==='admin'?sl('#/admin','shield','Admin',a==='admin'):''}<div class="sp"></div>${m?`<button class="sl" data-act="logout">${ic('out')}Log out</button>`:`<a class="btn" href="#/auth" style="margin:0 14px">Log in</a>`}`}
async function refreshCounts(){
 if(!S.me){S.cnt={n:0,c:0,f:0};chrome();return}
 try{const[n,c]=await Promise.all([sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',S.me.id).eq('read',false),sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient',S.me.id).eq('read',false)]);
 S.cnt.n=n.count||0;S.cnt.c=c.count||0}catch(e){}
 S.cnt.f=S.fr.filter(f=>f.status==='pending'&&f.addressee===S.me.id).length;chrome()}

/* ---------- render ---------- */
async function render(){
 const tok=++rtok;if(io){io.disconnect();io=null}feed=null;chatInfo=null;
 const m=S.me,{a,b}=route(),changed=location.hash!==lastKey;
 if(['post','chats','chat','friends','notifs','edit'].includes(a)&&!m){location.hash='#/auth';return}
 if(a==='auth'&&m){location.hash='#/home';return}
 if(changed){if(a==='u')S.ptab='posts';if(a!=='search')S.q='';lastKey=location.hash;window.scrollTo(0,0)}
 const P=pages[a]||pages.home,v=$('#view');
 document.body.classList.toggle('chatting',a==='chat');
 if(changed&&P.constructor.name==='AsyncFunction')v.innerHTML='<div class="spin" aria-label="Loading"></div>';
 chrome();
 let html;try{html=await P(b)}catch(e){html=empty('Something went wrong',esc(errMsg(e)),'<button class="btn sm" data-act="retry">Try again</button>')}
 if(tok!==rtok)return;
 v.innerHTML=html;
 if(hooks[a]){try{await hooks[a](b)}catch(e){toast(errMsg(e))}}
}

/* ---------- realtime ---------- */
function teardown(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}}
function subscribe(){
 teardown();const id=S.me.id;
 S.ch=sb.channel('gh-'+id)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient=eq.'+id},onMsg)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'sender=eq.'+id},onMsg)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+id},onNotif)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'friendships',filter:'addressee=eq.'+id},onFr)
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'friendships',filter:'requester=eq.'+id},onFr)
 .subscribe()}
async function onMsg(pl){
 const m=pl.new;if(!m||!S.me||seenMsg.has(m.id))return;seenMsg.add(m.id);
 const other=m.sender===S.me.id?m.recipient:m.sender,r=route();
 if(r.a==='chat'&&r.b===other){addBubble(m);
  if(m.recipient===S.me.id){await sb.from('messages').update({read:true}).eq('id',m.id);await sb.from('notifications').update({read:true}).eq('user_id',S.me.id).eq('type','message').eq('actor_id',other).eq('read',false)}
  refreshCounts();return}
 if(m.recipient===S.me.id){await loadProfiles([other]);toast((PC[other]?PC[other].username:'Someone')+' sent you a message')}
 await refreshCounts();if(r.a==='chats')render()}
async function onNotif(){await refreshCounts();if(route().a==='notifs')render()}
async function onFr(){await refreshFr();await refreshCounts();if(['friends','search','u','chats'].includes(route().a))render()}

/* ---------- session ---------- */
async function afterLogin(user){
 const{data,error}=await sb.from('profiles').select(PCOLS).eq('id',user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();throw error||new Error('Profile not found. Run schema.sql, then sign up again.')}
 S.me=data;PC[data.id]=data;await refreshFr();subscribe();refreshCounts()}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.me){S.me=null;S.fr=[];S.cnt={n:0,c:0,f:0};setTimeout(()=>{teardown();render()},0)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.me)refreshCounts()});

/* ---------- actions (clicks) ---------- */
const actions={
tab(t){const v=t.dataset.v;if((v==='following'||v==='mine')&&!S.me)return needLogin();S.tab=v;render()},
ptab(t){S.ptab=t.dataset.v;render()},
adm(t){S.adm=t.dataset.v;render()},
mode(){S.mode=S.mode==='login'?'signup':'login';render()},
retry(){if(feed&&feed.err){feed.err=false;loadMore()}else render()},
async like(t){if(!S.me)return needLogin();const id=t.dataset.id,p=POSTS[id];if(!p)return;
 const was=p.liked;p.liked=!was;p.likes+=was?-1:1;refreshPost(id);
 const{error}=was?await sb.from('likes').delete().eq('post_id',id).eq('user_id',S.me.id):await sb.from('likes').insert({post_id:id,user_id:S.me.id});
 if(error){p.liked=was;p.likes+=was?1:-1;refreshPost(id);toast(errMsg(error))}},
share(t){const url=location.origin+location.pathname+'#/p/'+t.dataset.id;
 if(navigator.share)navigator.share({title:'GistHub',url}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>prompt('Copy this link',url));else prompt('Copy this link',url)},
async delpost(t){if(!confirm('Delete this post?'))return;const id=t.dataset.id,p=POSTS[id];
 const{error}=await sb.from('posts').delete().eq('id',id);if(error)return toast(errMsg(error));
 if(p&&p.image_url){const a=storagePath(p.image_url,'posts'),b=storagePath(p.thumb_url,'posts');sb.storage.from('posts').remove([a,b].filter(Boolean))}
 delete POSTS[id];toast('Post deleted');if(route().a==='p')location.hash='#/home';else render()},
async delcomment(t){const{error}=await sb.from('comments').delete().eq('id',t.dataset.id);if(error)return toast(errMsg(error));render()},
rmimg(){S.img=null;$('#prev').innerHTML=''},
async addfriend(t){if(!S.me)return needLogin();const id=t.dataset.id;if(frOf(id))return;
 const{error}=await sb.from('friendships').insert({requester:S.me.id,addressee:id,status:'pending'});if(error)return toast(errMsg(error));
 await refreshFr();render();toast('Friend request sent')},
async cancelreq(t){const f=frOf(t.dataset.id);if(!f)return;const{error}=await sb.from('friendships').delete().eq('id',f.id);if(error)return toast(errMsg(error));await refreshFr();refreshCounts();render()},
async accept(t){const f=frOf(t.dataset.id);if(!f)return;const{error}=await sb.from('friendships').update({status:'accepted'}).eq('id',f.id);if(error)return toast(errMsg(error));await refreshFr();refreshCounts();render();toast('You are now friends')},
async reject(t){const f=frOf(t.dataset.id);if(!f)return;const{error}=await sb.from('friendships').delete().eq('id',f.id);if(error)return toast(errMsg(error));await refreshFr();refreshCounts();render()},
async unfriend(t){if(!confirm('Remove this friend?'))return;const f=frOf(t.dataset.id);if(!f)return;const{error}=await sb.from('friendships').delete().eq('id',f.id);if(error)return toast(errMsg(error));await refreshFr();render()},
async logout(){teardown();await sb.auth.signOut();S.me=null;S.fr=[];S.cnt={n:0,c:0,f:0};location.hash='#/home';render();toast('Logged out')},
adv(){window.open(waLink("Hello, I'd like to know about advertising packages on GistHub."),'_blank','noopener')},
adwa(t){window.open(waLink('Hello, I saw the '+t.dataset.name+' ad on GistHub and I would like to know more.'),'_blank','noopener')},
async older(t){if(!chatInfo||!chatInfo.oldest)return;const id=chatInfo.id;t.disabled=true;
 const{data,error}=await sb.from('messages').select('*').or('and(sender.eq.'+S.me.id+',recipient.eq.'+id+'),and(sender.eq.'+id+',recipient.eq.'+S.me.id+')').lt('created_at',chatInfo.oldest).order('created_at',{ascending:false}).limit(60);
 if(error){t.disabled=false;return toast(errMsg(error))}
 const list=(data||[]).reverse();list.forEach(m=>seenMsg.add(m.id));if(list[0])chatInfo.oldest=list[0].created_at;
 t.insertAdjacentHTML('afterend',list.map(bubble).join(''));if((data||[]).length<60)t.remove();else t.disabled=false},
async admpub(t){if(!S.me||S.me.role!=='admin')return;const{error}=await sb.from('ads').update({published:t.dataset.on!=='true'}).eq('id',t.dataset.id);if(error)return toast(errMsg(error));render()},
async admad(t){if(!S.me||S.me.role!=='admin'||!confirm('Delete this ad?'))return;const{data}=await sb.from('ads').select('image_url').eq('id',t.dataset.id).maybeSingle();
 const{error}=await sb.from('ads').delete().eq('id',t.dataset.id);if(error)return toast(errMsg(error));
 const p=data&&storagePath(data.image_url,'ads');if(p)sb.storage.from('ads').remove([p]);render()}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(t){const f=actions[t.dataset.act];if(f){e.preventDefault();f(t,e);return}}
 const g=e.target.closest('[data-go]');if(g&&!e.target.closest('a,button'))location.hash=g.dataset.go});

/* ---------- forms ---------- */
const USERNAME=/^[A-Za-z0-9_]{3,20}$/;
function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(label)btn.textContent=label}
const forms={
async post(f){if(!S.me)return needLogin();if(S.busy)return;const text=f.t.value.trim();if(!text&&!S.img)return toast('Write something or add a photo.');
 S.busy=true;const btn=$('#pbtn');busy(btn,true,'Posting...');
 try{let image_url=null,thumb_url=null,w=null,h=null;
  if(S.img){const base=S.me.id+'/'+Date.now();[image_url,thumb_url]=await Promise.all([upload('posts',base+'.jpg',S.img.main.blob),upload('posts',base+'_t.jpg',S.img.th.blob)]);w=S.img.main.w;h=S.img.main.h}
  const{error}=await sb.from('posts').insert({user_id:S.me.id,body:text||null,image_url,thumb_url,image_w:w,image_h:h});if(error)throw error;
  S.img=null;S.tab='latest';navTo('#/home');toast('Posted')}
 catch(e){toast(errMsg(e));busy(btn,false,'Post')}finally{S.busy=false}},
async comment(f){const text=f.t.value.trim();if(!S.me||!text)return;f.t.value='';
 const{error}=await sb.from('comments').insert({post_id:f.dataset.id,user_id:S.me.id,body:text});if(error){f.t.value=text;return toast(errMsg(error))}render()},
async chat(f){const id=f.dataset.id,text=f.t.value.trim();if(!text)return;f.t.value='';
 const{data,error}=await sb.from('messages').insert({sender:S.me.id,recipient:id,body:text}).select().single();
 if(error){f.t.value=text;return toast(errMsg(error))}seenMsg.add(data.id);addBubble(data)},
async auth(f){const err=$('#err'),btn=$('#abtn'),email=f.e.value.trim().toLowerCase(),p=f.p.value;err.textContent='';err.className='err';
 if(p.length<6)return err.textContent='Password must be at least 6 characters.';
 busy(btn,true);
 try{
  if(S.mode==='signup'){const u=f.u.value.trim();
   if(!USERNAME.test(u)){busy(btn,false);return err.textContent='Username must be 3-20 letters, numbers or underscores.'}
   const av=await sb.rpc('username_available',{u});if(av.error)throw av.error;if(!av.data){busy(btn,false);return err.textContent='That username is taken. Try another.'}
   const{data,error}=await sb.auth.signUp({email,password:p,options:{data:{username:u}}});if(error)throw error;
   if(!data.session){err.className='ok';err.textContent='Account created. Check your email to confirm it, then log in.';S.mode='login';busy(btn,false);return}
   await afterLogin(data.user);location.hash='#/home';render();toast('Welcome to GistHub, '+u)}
  else{const{data,error}=await sb.auth.signInWithPassword({email,password:p});if(error)throw error;
   await afterLogin(data.user);location.hash='#/home';render();toast('Welcome back, '+S.me.username)}
 }catch(e){busy(btn,false);const m=(e&&e.message)||'';
  err.textContent=/already registered|already been registered/i.test(m)?'That email already has an account. Log in instead.':/invalid login/i.test(m)?'Wrong email or password.':/not confirmed/i.test(m)?'Confirm your email first, then log in.':errMsg(e)}},
async edit(f){const m=S.me,err=$('#err'),u=f.u.value.trim(),btn=f.querySelector('button.full');err.textContent='';
 if(!USERNAME.test(u))return err.textContent='Username must be 3-20 letters, numbers or underscores.';
 busy(btn,true);
 try{let avatar_url=m.avatar_url;
  if(S.av)avatar_url=(await upload('avatars',m.id+'/avatar.jpg',S.av.blob,true))+'?v='+Date.now();
  const{data,error}=await sb.from('profiles').update({username:u,bio:f.b.value.trim().slice(0,160),avatar_url}).eq('id',m.id).select(PCOLS).single();
  if(error){if(error.code==='23505')throw new Error('That username is taken. Try another.');throw error}
  S.me=data;PC[m.id]=data;S.av=null;location.hash='#/u/'+encodeURIComponent(u);render();toast('Profile updated')}
 catch(e){busy(btn,false);err.textContent=errMsg(e)}},
async ad(f){if(!S.me||S.me.role!=='admin')return;const err=$('#err'),n=f.n.value.trim(),l=f.l.value.trim();err.textContent='';
 if(!n)return err.textContent='Enter the business name.';if(!S.adimg)return err.textContent='Choose an image.';
 if(l&&!/^https:\/\//i.test(l))return err.textContent='Link must start with https://';
 const btn=$('#adbtn');busy(btn,true,'Publishing...');
 try{const url=await upload('ads',Date.now()+'.jpg',S.adimg.blob);
  const{error}=await sb.from('ads').insert({name:n,description:f.d.value.trim(),link:l||null,image_url:url,image_w:S.adimg.w,image_h:S.adimg.h,published:true});if(error)throw error;
  S.adimg=null;render();toast('Ad published')}catch(e){busy(btn,false,'Publish ad');err.textContent=errMsg(e)}},
async wa(f){if(!S.me||S.me.role!=='admin')return;const err=$('#err'),d=f.w.value.replace(/\D/g,'');
 if(d.length<10||d.length>15)return err.textContent='Enter a valid number with country code.';
 const{error}=await sb.from('settings').upsert({key:'whatsapp',value:d});if(error)return err.textContent=errMsg(error);S.wa=d;err.textContent='';toast('Number saved')}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=forms[f.dataset.form];if(fn)fn(f)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;clearTimeout(sTimer);sTimer=setTimeout(runSearch,250)}});
document.addEventListener('change',async e=>{
 const i=e.target.closest('input[data-file]');if(!i||!i.files[0])return;const k=i.dataset.file,file=i.files[0];
 try{
  if(k==='post'){const[main,th]=await Promise.all([shrink(file,900,.65),shrink(file,240,.6)]);S.img={main,th};$('#prev').innerHTML=prevHTML()}
  else if(k==='avatar'){S.av=await shrink(file,160,.75,true);$('#avprev').innerHTML=`<img class="av lg" src="${S.av.url}" alt="">`}
  else if(k==='ad'){S.adimg=await shrink(file,800,.7);$('#adprev').innerHTML=`<img class="pimg" src="${S.adimg.url}" alt="" style="max-height:120px;width:auto">`}
 }catch(err){toast(errMsg(err))}
 i.value=''});

/* ---------- start ---------- */
(async()=>{
 let health='';
 try{const r=await fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY}});if(!r.ok)health='Supabase replied with error '+r.status+'. Check the project URL and key.'}
 catch(e){health='Cannot reach Supabase ('+e.message+'). Open supabase.com/dashboard: if the project says Paused, tap Restore project, then refresh this page.'}
 if(health){const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:100;background:#e5484d;color:#fff;padding:10px 14px;font-size:14px;font-weight:600';d.textContent=health;document.body.appendChild(d)}
 try{
  const[{data:{session}},st]=await Promise.all([sb.auth.getSession(),sb.from('settings').select('value').eq('key','whatsapp').maybeSingle()]);
  if(st&&st.data)S.wa=st.data.value;
  if(session)await afterLogin(session.user);
 }catch(e){toast(errMsg(e))}
 window.addEventListener('hashchange',render);
 render();
})();
})();
</script>
</body>
</html>
